function getCheapest(data) {
  let min = Infinity, minV = null;
  VENDORS.forEach(v => { if (data[v] && data[v] < min) { min = data[v]; minV = v; } });
  return { vendor: minV, price: min === Infinity ? null : min };
}

function PriceBar({ data }) {
  const vals = VENDORS.map(v => data[v]).filter(Boolean);
  if (!vals.length) return <div style={{fontSize:12,color:"#475569"}}>No pricing data available</div>;
  const minP = Math.min(...vals), maxP = Math.max(...vals);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      {VENDORS.map(v => {
        const p = data[v];
        if (!p) return null;
        const pct = maxP > minP ? ((p - minP)/(maxP - minP))*100 : 0;
        const isBest = p === minP;
        return (
          <div key={v} style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:88,fontSize:11,
              color:isBest?"#4ade80":VENDOR_META[v]?.isUSWarehouse?"#38bdf8":"#94a3b8",
              fontWeight:isBest?700:400,flexShrink:0}}>
              {v}
            </div>
            <div style={{flex:1,background:"#1e293b",borderRadius:3,height:5}}>
              <div style={{width:Math.max(2,pct)+"%",height:"100%",borderRadius:3,background:isBest?"#22c55e":"#4f46e5",transition:"width 0.4s"}}/>
            </div>
            <div style={{width:44,textAlign:"right",fontSize:12,fontWeight:isBest?700:400,color:isBest?"#4ade80":"#cbd5e1",flexShrink:0}}>${p}</div>
            <div style={{width:36,textAlign:"right",fontSize:10,color:isBest?"#22c55e":"#475569",flexShrink:0}}>{isBest?"BEST":"+$"+(p-minP)}</div>
          </div>
        );
      })}
    </div>
  );
}


// ─── FLAT INDEX & CART OPTIMIZER ─────────────────────────────────────────────
function buildFlatIndex() {
  const idx = {};
  Object.values(CATEGORIES).forEach(cat => {
    Object.values(cat.subcats).forEach(peptides => {
      Object.entries(peptides).forEach(([key, data]) => {
        if (data.label && Object.values(data).some(v => typeof v === "number"))
          idx[key] = data;
      });
    });
  });
  return idx;
}
const FLAT_INDEX = buildFlatIndex();

function getCheapestForVendor(key, vendor) {
  const d = FLAT_INDEX[key]; return d ? d[vendor] || null : null;
}

function bestVendorForItem(key) {
  const d = FLAT_INDEX[key]; if (!d) return { vendor: null, price: null };
  let min = Infinity, minV = null;
  VENDORS.forEach(v => { if (d[v] && d[v] < min) { min = d[v]; minV = v; } });
  return { vendor: minV, price: min === Infinity ? null : min };
}

function analyzeCart(cart) {
  if (!cart.length) return null;

  // Dollar value each vendor wins at best prices (qty × best_price)
  // High-volume cheap items count heavily — this is the key weighting
  const vendorDollarWins = {};
  VENDORS.forEach(v => { vendorDollarWins[v] = 0; });
  cart.forEach(({ key, qty }) => {
    const { vendor, price } = bestVendorForItem(key);
    if (vendor) vendorDollarWins[vendor] += price * qty;
  });

  // Helper: build vendor->items map from an assignment function
  const buildMap = (assignFn) => {
    const map = {};
    cart.forEach(({ key, qty }) => {
      const { vendor, price } = assignFn(key, qty);
      if (!vendor || !price) return;
      if (!map[vendor]) map[vendor] = [];
      map[vendor].push({ key, label: FLAT_INDEX[key]?.label || key, price, qty, subtotal: price * qty });
    });
    return map;
  };

  // ── 1. SMART SPLIT ────────────────────────────────────────────────────────
  // Anchor = vendor winning most dollar value. Only route item elsewhere
  // if savings on that specific item exceed $40 threshold.
  const smartAnchor = [...VENDORS].sort((a, b) => vendorDollarWins[b] - vendorDollarWins[a])[0];
  const SMART_THRESHOLD = 40;
  const smartMap = buildMap((key) => {
    const anchorPrice = getCheapestForVendor(key, smartAnchor);
    const { vendor: cheapV, price: cheapP } = bestVendorForItem(key);
    if (!anchorPrice) return { vendor: cheapV, price: cheapP };
    const savings = anchorPrice - (cheapP || anchorPrice);
    if (savings > SMART_THRESHOLD && cheapV !== smartAnchor)
      return { vendor: cheapV, price: cheapP };
    return { vendor: smartAnchor, price: anchorPrice };
  });

  // ── 2. SINGLE VENDOR (dollar-value weighted) ──────────────────────────────
  // Same anchor logic — vendor winning most spend fills the whole order.
  // You pay a small premium on lower-qty items to avoid multiple shipments.
  // Falls back to cheapest available only if anchor doesn't carry an item.
  const singleAnchor = smartAnchor; // same anchor, different fill rule
  const singleMap = buildMap((key) => {
    const p = getCheapestForVendor(key, singleAnchor);
    if (p) return { vendor: singleAnchor, price: p };
    return bestVendorForItem(key); // fallback only if not carried
  });
  const singleUncovered = cart
    .filter(({ key }) => !getCheapestForVendor(key, singleAnchor))
    .map(({ key }) => FLAT_INDEX[key]?.label || key);

  // ── 3. CONSOLIDATION (best vendor pair) ───────────────────────────────────
  // Try every combination of 2 vendors. Assign each item to whichever of
  // the pair is cheaper (or the one that carries it). Pick the pair with
  // the lowest total item cost across the whole cart.
  let bestPairCost = Infinity, bestPairMap = {}, bestPair = ["—", "—"];
  for (let i = 0; i < VENDORS.length; i++) {
    for (let j = i + 1; j < VENDORS.length; j++) {
      const vA = VENDORS[i], vB = VENDORS[j];
      let total = 0;
      const tempMap = { [vA]: [], [vB]: [] };
      let allCovered = true;
      cart.forEach(({ key, qty }) => {
        const pA = getCheapestForVendor(key, vA);
        const pB = getCheapestForVendor(key, vB);
        if (!pA && !pB) { allCovered = false; return; }
        const useA = pA && (!pB || pA <= pB);
        const v = useA ? vA : vB;
        const p = useA ? pA : pB;
        total += p * qty;
        tempMap[v].push({ key, label: FLAT_INDEX[key]?.label || key, price: p, qty, subtotal: p * qty });
      });
      if (!allCovered) continue;
      if (total < bestPairCost) {
        bestPairCost = total;
        bestPairMap = {};
        if (tempMap[vA].length) bestPairMap[vA] = tempMap[vA];
        if (tempMap[vB].length) bestPairMap[vB] = tempMap[vB];
        bestPair = [vA, vB];
      }
    }
  }

  return { smartMap, smartAnchor, singleMap, singleAnchor, singleUncovered, consolidationMap: bestPairMap, bestPair };
}

    const usName = US_KEY_MAP[key];
    const label = FLAT_INDEX[key]?.label || key;
    const hkData = usName ? HK_US_INVENTORY[usName] : null;
    const barnData = usName ? BARN_US_INVENTORY[usName] : null;

    if (hkData) hkItems.push({ key, label, qty, usName, ...hkData });
    else if (barnData) barnItems.push({ key, label, qty, usName, ...barnData });
    else notAvailable.push({ key, label, qty });
  });

  // Separate BARN items by in stock status
  const hkSubtotal = hkItems.reduce((s, i) => s + i.price * i.qty, 0);
  const barnSubtotal = barnItems.reduce((s, i) => s + i.price * i.qty, 0);

  const hkShip = Number(shippingUS["HK🇺🇸"]) || 0;
  const hkShipEntered = shippingUS["HK🇺🇸"] !== "";
  const hkTotal = hkShipEntered ? hkSubtotal + hkShip : null;
  const barnTotal = barnSubtotal; // free shipping

  return (
    <div>
      {/* Notice */}
      <div style={{ background:"#0a1525", border:"1px solid #1e3a5f", borderRadius:8, padding:"10px 14px", marginBottom:16, fontSize:12, color:"#94a3b8" }}>
        <span style={{ color:"#38bdf8", fontWeight:700 }}>🇺🇸 US Warehouse Mode</span> — Shows items carried by HK or BARN US warehouses with their US prices.
        Check each vendor's current sheet for live stock availability before ordering.
      </div>

      {/* HK US */}
      {hkItems.length > 0 && (
        <div style={{ background:"#0d0f1c", border:"1px solid #1a1f35", borderRadius:10, overflow:"hidden", marginBottom:16 }}>
          <div style={{ padding:"10px 16px", background:"#0c1220", borderBottom:"1px solid #1a1f35",
            display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:15, fontWeight:700, color:"#38bdf8" }}>HK 🇺🇸</span>
              <span style={{ fontSize:11, color:"#475569" }}>Confirm shipping with vendor</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span style={{ fontSize:12, color:"#64748b" }}>Items: <strong style={{ color:"#e2e8f0" }}>${hkSubtotal}</strong></span>
              <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                <span style={{ fontSize:12, color:"#64748b" }}>+ Ship: $</span>
                <input type="number" min="0" value={shippingUS["HK🇺🇸"]}
                  onChange={e => setShippingUS(p => ({ ...p, "HK🇺🇸": e.target.value }))}
                  placeholder="enter"
                  style={{ width:68, background:"#0d0f1c", border:`1px solid ${hkShipEntered?"#6366f1":"#334155"}`,
                    color:"#e2e8f0", padding:"4px 8px", borderRadius:6, fontSize:12, fontFamily:"inherit", outline:"none" }} />
              </div>
              {hkTotal !== null && <span style={{ fontSize:13, fontWeight:700, color:"#4ade80" }}>= ${hkTotal}</span>}
            </div>
          </div>
          {hkItems.map(item => (
            <div key={item.key} style={{ padding:"8px 16px", borderBottom:"1px solid #0a0b14",
              display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:12 }}>
              <span style={{ color:"#94a3b8" }}>{item.label} × {item.qty}</span>
              <span style={{ color:"#e2e8f0" }}>${item.price} × {item.qty} = <strong>${item.price * item.qty}</strong></span>
            </div>
          ))}
        </div>
      )}

      {/* BARN US */}
      {barnItems.length > 0 && (
        <div style={{ background:"#0d0f1c", border:"1px solid #1a1f35", borderRadius:10, overflow:"hidden", marginBottom:16 }}>
          <div style={{ padding:"10px 16px", background:"#0c1220", borderBottom:"1px solid #1a1f35",
            display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:15, fontWeight:700, color:"#38bdf8" }}>BARN 🇺🇸</span>
              <span style={{ fontSize:10, color:"#22c55e", background:"#052e16", padding:"2px 7px", borderRadius:10 }}>✓ Free Shipping</span>
            </div>
            <div style={{ fontSize:12, color:"#64748b" }}>
              Items: <strong style={{ color:"#e2e8f0" }}>${barnSubtotal}</strong>
              <span style={{ color:"#4ade80", marginLeft:8, fontWeight:700 }}>Total: ${barnTotal}</span>
            </div>
          </div>
          {barnItems.map(item => (
            <div key={item.key} style={{ padding:"8px 16px", borderBottom:"1px solid #0a0b14",
              display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:12 }}>
              <span style={{ color:"#94a3b8" }}>{item.label} × {item.qty}</span>
              <span style={{ color:"#e2e8f0" }}>${item.price} × {item.qty} = <strong>${item.price * item.qty}</strong></span>
            </div>
          ))}
        </div>
      )}

      {/* Not available in US */}
      {notAvailable.length > 0 && (
        <div style={{ background:"#0d0f1c", border:"1px solid #1a1f35", borderRadius:8, padding:"12px 16px", marginBottom:16 }}>
          <div style={{ fontSize:11, color:"#f59e0b", marginBottom:8, fontWeight:700 }}>⚠️ Not available in US warehouses — order from China:</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {notAvailable.map(item => {
              const { vendor, price } = bestVendorForItem(item.key);
              return (
                <div key={item.key} style={{ background:"#0a0b14", border:"1px solid #1e293b", borderRadius:6, padding:"4px 10px", fontSize:11 }}>
                  <span style={{ color:"#64748b" }}>{item.label} × {item.qty}</span>
                  {vendor && <span style={{ color:"#4ade80", marginLeft:6 }}>→ {vendor} ${price}</span>}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Nothing available */}
      {hkItems.length === 0 && barnItems.length === 0 && notAvailable.length > 0 && (
        <div style={{ background:"#1a0f0f", border:"1px solid #7f1d1d", borderRadius:8, padding:16, textAlign:"center", fontSize:13, color:"#f87171" }}>
          None of the items in your cart are available in US warehouses. Use a China warehouse mode instead.
        </div>
      )}
    </div>
  );
}

function VendorBreakdown({ vendorMap, vendorShipping, setVendorShip, label }) {
  const vendors = Object.keys(vendorMap);
  const itemTotal = Object.values(vendorMap).flat().reduce((s, i) => s + i.subtotal, 0);
  const allEntered = vendors.length > 0 && vendors.every(v => vendorShipping[v] !== "" && !isNaN(Number(vendorShipping[v])));
  const totalShipping = allEntered ? vendors.reduce((s, v) => s + Number(vendorShipping[v]), 0) : null;
  const grand = allEntered ? itemTotal + totalShipping : null;

  return (
    <div style={{ background: "#0d0f1c", border: "1px solid #1a1f35", borderRadius: 10, overflow: "hidden", marginBottom: 4 }}>
      {/* Header */}
      <div style={{ padding: "12px 16px", background: "#0f1230", borderBottom: "1px solid #1a1f35", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
        <div>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#a5b4fc" }}>{label}</span>
          <span style={{ fontSize: 11, color: "#475569", marginLeft: 10 }}>{vendors.length} vendor{vendors.length !== 1 ? "s" : ""}</span>
        </div>
        <div style={{ fontSize: 12, color: "#64748b" }}>
          Items: <strong style={{ color: "#e2e8f0" }}>${itemTotal.toFixed(0)}</strong>
          <span style={{ color: "#475569" }}> + shipping below</span>
        </div>
      </div>

      {/* Per-vendor rows */}
      {Object.entries(vendorMap).map(([vendor, items]) => {
        const itemSub = items.reduce((s, i) => s + i.subtotal, 0);
        const shipVal = vendorShipping[vendor] ?? "";
        const shipNum = shipVal !== "" && !isNaN(Number(shipVal)) ? Number(shipVal) : null;
        const vendorTotal = shipNum !== null ? itemSub + shipNum : null;
        return (
          <div key={vendor} style={{ borderBottom: "1px solid #1a1f35" }}>
            <div style={{ padding: "10px 16px", background: "#0c1220", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 14, fontWeight: 700, color: "#c4b5fd" }}>{vendor}</span>
                {VENDOR_META[vendor]?.usWarehouse && <span style={{ fontSize: 10, color: "#f59e0b", background: "#1c1400", border:"1px solid #78350f", padding: "2px 7px", borderRadius: 10 }}>CN price · US stock avail ↓</span>}
                {VENDOR_META[vendor]?.volDiscount && <span style={{ fontSize: 10, color: "#3b82f6", background: "#0c1a3a", padding: "2px 7px", borderRadius: 10 }}>vol. discounts</span>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: "#64748b" }}>Items: <strong style={{ color: "#e2e8f0" }}>${itemSub.toFixed(0)}</strong></span>
                <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ fontSize: 12, color: "#64748b" }}>+ Ship: $</span>
                  <input type="number" min="0" value={shipVal}
                    onChange={e => setVendorShip(vendor, e.target.value)}
                    placeholder="enter"
                    style={{ width: 68, background: "#0d0f1c", border: `1px solid ${shipNum !== null ? "#6366f1" : "#334155"}`,
                      color: "#e2e8f0", padding: "4px 8px", borderRadius: 6, fontSize: 12, fontFamily: "inherit", outline: "none" }} />
                </div>
                {vendorTotal !== null && <span style={{ fontSize: 13, fontWeight: 700, color: "#4ade80" }}>= ${vendorTotal.toFixed(0)}</span>}
              </div>
            </div>
            {items.map(item => (
              <div key={item.key} style={{ padding: "6px 16px 6px 28px", display: "flex", justifyContent: "space-between", fontSize: 12, borderTop: "1px solid #0a0b14" }}>
                <span style={{ color: "#94a3b8" }}>{item.label} × {item.qty}</span>
                <span style={{ color: "#cbd5e1" }}>${item.price} × {item.qty} = <strong style={{ color: "#e2e8f0" }}>${item.subtotal}</strong></span>
              </div>
            ))}
            {/* US warehouse note for HK and BARN */}
            {VENDOR_META[vendor]?.usWarehouse && VENDOR_META[vendor]?.usItems && (
              <div style={{ background: "#0a1a0a", borderTop: "1px solid #14532d", padding: "10px 16px" }}>
                <div style={{ fontSize: 11, color: "#22c55e", fontWeight: 700, marginBottom: 6 }}>🇺🇸 US Warehouse — Check Stock Before Ordering</div>
                <div style={{ fontSize: 11, color: "#64748b", marginBottom: 6 }}>{VENDOR_META[vendor].usStockNote}</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                  {Object.entries(VENDOR_META[vendor].usItems).map(([name, price]) => (
                    <div key={name} style={{ background: "#052e16", border: "1px solid #166534", borderRadius: 5, padding: "3px 8px", fontSize: 11 }}>
                      <span style={{ color: "#94a3b8" }}>{name}: </span>
                      <span style={{ color: price.includes("IN STOCK") ? "#4ade80" : "#86efac", fontWeight: 700 }}>{price}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Grand total */}
      <div style={{ padding: "12px 16px", background: "#0a0b14" }}>
        {!allEntered
          ? <div style={{ fontSize: 12, color: "#475569" }}>⬆️ Enter shipping quote from each vendor above to see your real grand total.</div>
          : <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
              <div style={{ fontSize: 12, color: "#64748b", display: "flex", gap: 16, flexWrap: "wrap" }}>
                <span>Items: <strong style={{ color: "#e2e8f0" }}>${itemTotal.toFixed(0)}</strong></span>
                <span>Shipping: <strong style={{ color: "#e2e8f0" }}>${totalShipping.toFixed(0)}</strong></span>
              </div>
              <div style={{ fontSize: 20, fontWeight: 700, color: "#4ade80" }}>Grand Total: ${grand.toFixed(0)}</div>
            </div>
        }
      </div>
    </div>
  );
}

function CartTab() {
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState("");
  const [searchRes, setSearchRes] = useState([]);
  const [mode, setMode] = useState("smart");
  // Separate shipping state per mode so entries don't bleed across tabs
  const [shippingSmart, setShippingSmart] = useState({});
  const [shippingSingle, setShippingSingle] = useState({});
  const [shippingConsolidation, setShippingConsolidation] = useState({});
  const [shippingUS, setShippingUS] = useState({ "HK🇺🇸": "", "BARN🇺🇸": "" });

  // Keys belonging to the Blends & Combos category
  const BLEND_KEYS = (() => {
    const keys = new Set();
    const blendCat = CATEGORIES["🧬 Blends & Combos"];
    if (blendCat) Object.values(blendCat.subcats).forEach(p => Object.keys(p).forEach(k => keys.add(k)));
    return keys;
  })();

  const handleSearch = (t) => {
    setSearch(t);
    if (!t.trim()) { setSearchRes([]); return; }
    const lc = t.toLowerCase();
    const matches = Object.entries(FLAT_INDEX)
      .filter(([, d]) => d.label?.toLowerCase().includes(lc))
      .map(([key, data]) => {
        const isBlend = BLEND_KEYS.has(key);
        const labelLc = data.label.toLowerCase();
        // Score: exact name start = 0, partial = 1, blend adds +2 so blends always sink below standalones
        const score = (labelLc.startsWith(lc) ? 0 : 1) + (isBlend ? 2 : 0);
        return { key, data, isBlend, score };
      })
      .sort((a, b) => a.score - b.score)
      .slice(0, 9);
    setSearchRes(matches);
  };

  const addItem = (key) => {
    setCart(p => p.find(i => i.key === key)
      ? p.map(i => i.key === key ? { ...i, qty: i.qty + 1 } : i)
      : [...p, { key, qty: 1 }]);
    setSearch(""); setSearchRes([]);
  };

  const setQty = (key, qty) => {
    if (qty < 1) setCart(p => p.filter(i => i.key !== key));
    else setCart(p => p.map(i => i.key === key ? { ...i, qty } : i));
  };

  const analysis = useMemo(() => analyzeCart(cart), [cart]);

  const makeSetShip = (setter) => (vendor, val) => setter(p => ({ ...p, [vendor]: val }));

  const MODES = [
    { id: "smart",  label: "🎯 Smart Split",    desc: `Anchor: ${analysis?.smartAnchor || "—"}. Splits off items only when per-item savings exceed $40.`, color: "#6366f1" },
    { id: "single", label: "📦 Single Vendor",  desc: `Anchor: ${analysis?.singleAnchor || "—"}. Fills entire order from one vendor — pays small premium on low-qty items to avoid extra shipments.`, color: "#22c55e" },
    { id: "consolidation", label: "🤝 Consolidation", desc: `Best pair: ${analysis?.bestPair?.join(" + ") || "—"}. Finds the 2-vendor combo with the lowest total item cost.`, color: "#f59e0b" },
    { id: "us", label: "🇺🇸 US Warehouse",  desc: "Quick domestic orders from HK and BARN US stock. Free shipping from BARN. Check live availability.", color: "#38bdf8" },
  ];

  return (
    <div style={{ maxWidth: 1140, margin: "0 auto", padding: "24px 20px" }}>
      <h2 style={{ margin: "0 0 4px", fontSize: 18, color: "#f1f5f9" }}>🛒 Restock Cart</h2>
      <p style={{ margin: "0 0 20px", fontSize: 12, color: "#64748b" }}>
        Add peptides and quantities. Pick a strategy, then enter the actual shipping quote from each vendor shown to get your real grand total.
      </p>

      {/* Search */}
      <div style={{ position: "relative", marginBottom: 20 }}>
        <input value={search} onChange={e => handleSearch(e.target.value)}
          placeholder="Search peptide to add to cart..."
          style={{ width: "100%", background: "#0d0f1c", border: "1px solid #6366f1", color: "#e2e8f0",
            padding: "10px 14px", borderRadius: 8, fontSize: 13, fontFamily: "inherit", outline: "none", boxSizing: "border-box" }} />
        {searchRes.length > 0 && (
          <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#0d0f1c",
            border: "1px solid #1e293b", borderRadius: "0 0 8px 8px", zIndex: 100, maxHeight: 280, overflowY: "auto" }}>
            {searchRes.map(({ key, data, isBlend }) => {
              const { vendor, price } = bestVendorForItem(key);
              return (
                <div key={key} onClick={() => addItem(key)}
                  style={{ padding: "10px 14px", cursor: "pointer", borderBottom: "1px solid #1a1f35",
                    display: "flex", justifyContent: "space-between", alignItems: "center" }}
                  onMouseEnter={e => e.currentTarget.style.background = "#0f1a2e"}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 13, color: "#e2e8f0" }}>{data.label}</span>
                    {isBlend && <span style={{ fontSize: 9, letterSpacing: 1, color: "#f59e0b", background: "#1c1400", border: "1px solid #78350f", padding: "1px 5px", borderRadius: 4, textTransform: "uppercase" }}>blend</span>}
                  </div>
                  {vendor && <span style={{ fontSize: 12, color: "#4ade80" }}>Best: {vendor} ${price}</span>}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Cart table */}
      {cart.length === 0 ? (
        <div style={{ background: "#0d0f1c", border: "1px solid #1a1f35", borderRadius: 10, padding: 32, textAlign: "center", color: "#475569", fontSize: 14 }}>
          Your cart is empty. Search for peptides above to add them.
        </div>
      ) : (
        <>
          <div style={{ background: "#0d0f1c", border: "1px solid #1a1f35", borderRadius: 10, marginBottom: 24, overflow: "hidden" }}>
            <div style={{ padding: "10px 16px", borderBottom: "1px solid #1a1f35", display: "grid", gridTemplateColumns: "1fr 130px 90px 36px", gap: 8 }}>
              {["Peptide", "Best Price", "Qty (kits)", ""].map((h, i) => (
                <div key={i} style={{ fontSize: 10, letterSpacing: 2, color: "#475569", textTransform: "uppercase" }}>{h}</div>
              ))}
            </div>
            {cart.map(({ key, qty }) => {
              const data = FLAT_INDEX[key];
              if (!data) return null;
              const { vendor, price } = bestVendorForItem(key);
              return (
                <div key={key} style={{ padding: "10px 16px", borderBottom: "1px solid #0d0f1c",
                  display: "grid", gridTemplateColumns: "1fr 130px 90px 36px", gap: 8, alignItems: "center" }}>
                  <div style={{ fontSize: 13, color: "#e2e8f0" }}>{data.label}</div>
                  <div style={{ fontSize: 12 }}>
                    {vendor ? <span style={{ color: "#4ade80" }}>{vendor} <strong>${price}</strong></span>
                      : <span style={{ color: "#475569" }}>—</span>}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <button onClick={() => setQty(key, qty - 1)} style={{ width: 24, height: 24, background: "#1e293b", border: "none", color: "#e2e8f0", borderRadius: 4, cursor: "pointer", fontSize: 14 }}>−</button>
                    <span style={{ fontSize: 13, color: "#f1f5f9", minWidth: 22, textAlign: "center" }}>{qty}</span>
                    <button onClick={() => setQty(key, qty + 1)} style={{ width: 24, height: 24, background: "#1e293b", border: "none", color: "#e2e8f0", borderRadius: 4, cursor: "pointer", fontSize: 14 }}>+</button>
                  </div>
                  <button onClick={() => setCart(p => p.filter(i => i.key !== key))}
                    style={{ background: "none", border: "none", color: "#ef4444", cursor: "pointer", fontSize: 15 }}>✕</button>
                </div>
              );
            })}
          </div>

          {/* Mode selector */}
          {analysis && (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 10, marginBottom: 20 }}>
                {MODES.map(m => (
                  <div key={m.id} onClick={() => setMode(m.id)} style={{
                    background: mode === m.id ? "#0f0f2e" : "#0d0f1c",
                    border: `2px solid ${mode === m.id ? m.color : "#1a1f35"}`,
                    borderRadius: 10, padding: 14, cursor: "pointer", transition: "all 0.15s"
                  }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: mode === m.id ? m.color : "#94a3b8", marginBottom: 6 }}>{m.label}</div>
                    <div style={{ fontSize: 11, color: "#475569", lineHeight: 1.5 }}>{m.desc}</div>
                  </div>
                ))}
              </div>

              {/* Smart Split */}
              {mode === "smart" && (
                <VendorBreakdown
                  vendorMap={analysis.smartMap}
                  vendorShipping={shippingSmart}
                  setVendorShip={makeSetShip(setShippingSmart)}
                  label={`🎯 Smart Split — Anchor: ${analysis.smartAnchor}`}
                />
              )}

              {/* Single Vendor */}
              {mode === "single" && (
                <>
                  <VendorBreakdown
                    vendorMap={analysis.singleMap}
                    vendorShipping={shippingSingle}
                    setVendorShip={makeSetShip(setShippingSingle)}
                    label={`📦 Single Vendor — ${analysis.singleAnchor}`}
                  />
                  {analysis.singleUncovered?.length > 0 && (
                    <div style={{ background: "#1a0f0f", border: "1px solid #7f1d1d", borderRadius: 8, padding: "10px 14px", fontSize: 12, marginTop: 8 }}>
                      <div style={{ color: "#f87171", marginBottom: 4 }}>⚠️ {analysis.singleAnchor} doesn't carry these — routed to next best vendor:</div>
                      {analysis.singleUncovered.map(n => <div key={n} style={{ color: "#ef4444", paddingLeft: 12 }}>• {n}</div>)}
                    </div>
                  )}
                </>
              )}

              {/* Consolidation */}
              {mode === "consolidation" && (
                <VendorBreakdown
                  vendorMap={analysis.consolidationMap}
                  vendorShipping={shippingConsolidation}
                  setVendorShip={makeSetShip(setShippingConsolidation)}
                  label={`🤝 Consolidation — ${analysis.bestPair?.join(" + ")}`}
                />
              )}

              {/* US Warehouse */}
              {mode === "us" && (
                <USWarehouseCart cart={cart} shippingUS={shippingUS} setShippingUS={setShippingUS} />
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("🎯 Retatrutide");
  const [openPeptide, setOpenPeptide] = useState(null);
  const [openSubcat, setOpenSubcat] = useState(null);
  const [searchTerm, setSearchTerm] = useState("");

  const catNames = [...Object.keys(CATEGORIES), "🛒 Cart"];

  // Build flat search index
  const searchIndex = useMemo(() => {
    const results = [];
    Object.entries(CATEGORIES).forEach(([catName, catData]) => {
      Object.entries(catData.subcats).forEach(([subcatName, peptides]) => {
        Object.entries(peptides).forEach(([key, data]) => {
          if (!data.label) return;
          const best = getCheapest(data);
          results.push({ key, catName, subcatName, data, best });
        });
      });
    });
    return results;
  }, []);

  const searchResults = useMemo(() => {
    if (!searchTerm.trim()) return [];
    const term = searchTerm.toLowerCase();
    return searchIndex.filter(r => r.data.label.toLowerCase().includes(term) || r.subcatName.toLowerCase().includes(term));
  }, [searchTerm, searchIndex]);

  const currentCat = CATEGORIES[activeTab];

  return (
    <div style={{minHeight:"100vh",background:"#07080f",color:"#e2e8f0",fontFamily:"'Georgia','Times New Roman',serif"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0d0d1a,#12101f)",borderBottom:"1px solid #1a1f35",padding:"18px 24px"}}>
        <div style={{maxWidth:1140,margin:"0 auto"}}>
          <div style={{fontSize:9,letterSpacing:4,color:"#6366f1",textTransform:"uppercase",marginBottom:3}}>Peptide Procurement Intelligence</div>
          <h1 style={{margin:0,fontSize:22,fontWeight:700,color:"#f1f5f9"}}>Full Vendor Strategy Dashboard</h1>
          <div style={{fontSize:11,color:"#475569",marginTop:3}}>14 vendors · Complete catalog audit · All peptides · May 2026</div>
        </div>
      </div>

      {/* Search bar — hidden on cart tab */}
      {activeTab !== "🛒 Cart" && (
        <div style={{background:"#0a0b14",borderBottom:"1px solid #1a1f35",padding:"12px 24px"}}>
          <div style={{maxWidth:1140,margin:"0 auto"}}>
            <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}
              placeholder="🔍 Search any peptide..."
              style={{width:"100%",maxWidth:400,background:"#0d0f1c",border:"1px solid #1e293b",color:"#e2e8f0",
                padding:"8px 14px",borderRadius:8,fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
          </div>
        </div>
      )}

      {/* Search results overlay */}
      {searchTerm.trim() && activeTab !== "🛒 Cart" && (
        <div style={{maxWidth:1140,margin:"0 auto",padding:"20px 24px"}}>
          <div style={{fontSize:12,color:"#6366f1",letterSpacing:2,textTransform:"uppercase",marginBottom:12}}>
            Search Results — {searchResults.length} found
          </div>
          {searchResults.length === 0 && <div style={{color:"#475569",fontSize:13}}>No peptides match "{searchTerm}"</div>}
          {searchResults.map(r => {
            const isOpen = openPeptide === r.key+"_search";
            const best = r.best;
            return (
              <div key={r.key} style={{marginBottom:8}}>
                <div onClick={()=>setOpenPeptide(isOpen?null:r.key+"_search")} style={{
                  background:"#0d0f1c",border:"1px solid #1a1f35",borderRadius:8,padding:"10px 14px",
                  cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                  <div>
                    <span style={{fontSize:14,color:"#f1f5f9",fontWeight:600}}>{r.data.label}</span>
                    <span style={{fontSize:11,color:"#475569",marginLeft:10}}>{r.catName} › {r.subcatName}</span>
                  </div>
                  <div style={{display:"flex",gap:12,alignItems:"center"}}>
                    {best.vendor && <span style={{fontSize:13,color:"#4ade80",fontWeight:700}}>{best.vendor} @ ${best.price}</span>}
                    <span style={{color:"#6366f1",fontSize:12}}>{isOpen?"▲":"▼"}</span>
                  </div>
                </div>
                {isOpen && <div style={{background:"#0a0b14",border:"1px solid #1a1f35",borderTop:"none",borderRadius:"0 0 8px 8px",padding:14}}><PriceBar data={r.data}/></div>}
              </div>
            );
          })}
        </div>
      )}

      {/* Tab bar */}
      {!searchTerm.trim() && (
        <div style={{borderBottom:"1px solid #1a1f35",background:"#0a0b14",overflowX:"auto"}}>
          <div style={{display:"flex",minWidth:"max-content",maxWidth:1140,margin:"0 auto"}}>
            {catNames.map(name=>(
              <button key={name} onClick={()=>{setActiveTab(name);setOpenPeptide(null);setOpenSubcat(null);setSearchTerm("");}} style={{
                padding:"11px 16px",background:"none",border:"none",whiteSpace:"nowrap",
                borderBottom:activeTab===name?"2px solid #6366f1":"2px solid transparent",
                color:activeTab===name?"#a5b4fc":"#64748b",
                cursor:"pointer",fontSize:11,fontFamily:"inherit",fontWeight:activeTab===name?700:400,
              }}>{name}</button>
            ))}
          </div>
        </div>
      )}

      {/* Cart tab */}
      {!searchTerm.trim() && activeTab === "🛒 Cart" && <CartTab />}

      {/* Main catalog content */}
      {!searchTerm.trim() && currentCat && (
        <div style={{maxWidth:1140,margin:"0 auto",padding:"24px 20px"}}>
          <div style={{marginBottom:20}}>
            <h2 style={{margin:"0 0 4px",fontSize:18,color:"#f1f5f9"}}>{activeTab}</h2>
            <p style={{margin:0,fontSize:12,color:"#64748b"}}>{currentCat.note}</p>
          </div>

          {Object.entries(currentCat.subcats).map(([subcatName, peptides]) => {
            const validPeptides = Object.entries(peptides).filter(([,d])=>d.label && Object.values(d).some(v=>typeof v==="number"));
            if (!validPeptides.length) return null;
            const isSubOpen = openSubcat === subcatName || Object.keys(currentCat.subcats).length <= 2;
            const subcatBests = {};
            validPeptides.forEach(([key,data])=>{ subcatBests[key]=getCheapest(data); });

            return (
              <div key={subcatName} style={{marginBottom:16}}>
                <div onClick={()=>setOpenSubcat(isSubOpen&&openSubcat===subcatName?null:subcatName)}
                  style={{background:"#0d0f1c",border:"1px solid #1a1f35",borderRadius:isSubOpen?"10px 10px 0 0":10,
                    padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{fontSize:14,fontWeight:700,color:"#e2e8f0"}}>{subcatName}</div>
                  <div style={{display:"flex",alignItems:"center",gap:12}}>
                    <span style={{fontSize:11,color:"#64748b"}}>{validPeptides.length} peptide{validPeptides.length!==1?"s":""}</span>
                    <span style={{color:"#6366f1",fontSize:12}}>{isSubOpen?"▲":"▼"}</span>
                  </div>
                </div>

                {isSubOpen && (
                  <div style={{background:"#0a0b14",border:"1px solid #1a1f35",borderTop:"none",borderRadius:"0 0 10px 10px",padding:16}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:8,marginBottom:16}}>
                      {validPeptides.map(([key,data])=>{
                        const best = subcatBests[key];
                        const isOpen = openPeptide===key;
                        const vals = VENDORS.map(v=>data[v]).filter(Boolean);
                        const vendorCount = vals.length;
                        return (
                          <div key={key}>
                            <div onClick={()=>setOpenPeptide(isOpen?null:key)} style={{
                              background:isOpen?"#0f1a2e":"#0d0f1c",
                              border:`1px solid ${isOpen?"#1e3a5f":"#1a1f35"}`,
                              borderRadius:8,padding:12,cursor:"pointer",transition:"all 0.15s"}}>
                              <div style={{fontSize:11,color:"#94a3b8",marginBottom:5,lineHeight:1.3}}>{data.label}</div>
                              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
                                {best.vendor
                                  ? <span style={{fontSize:18,fontWeight:700,color:"#4ade80"}}>${best.price}</span>
                                  : <span style={{fontSize:12,color:"#475569"}}>No data</span>}
                                <span style={{fontSize:10,color:"#6366f1"}}>{best.vendor||""}</span>
                              </div>
                              <div style={{fontSize:10,color:"#334155",marginTop:3}}>{vendorCount} vendor{vendorCount!==1?"s":""} carry this</div>
                            </div>
                            {isOpen && (
                              <div style={{background:"#060710",border:"1px solid #1a1f35",borderTop:"none",borderRadius:"0 0 8px 8px",padding:12}}>
                                <PriceBar data={data}/>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    <div style={{borderTop:"1px solid #1a1f35",paddingTop:12}}>
                      <div style={{fontSize:10,letterSpacing:2,color:"#475569",textTransform:"uppercase",marginBottom:8}}>Best Price Per Item</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                        {validPeptides.map(([key,data])=>{
                          const best = subcatBests[key];
                          if (!best.vendor) return null;
                          const vals = VENDORS.map(v=>data[v]).filter(Boolean);
                          const worst = Math.max(...vals);
                          return (
                            <div key={key} style={{background:"#0d0f1c",border:"1px solid #1a1f35",borderRadius:6,padding:"6px 10px",fontSize:11}}>
                              <span style={{color:"#64748b"}}>{data.label}: </span>
                              <span style={{color:"#4ade80",fontWeight:700}}>{best.vendor} ${best.price}</span>
                              {worst>best.price&&<span style={{color:"#ef4444"}}> (saves ${worst-best.price})</span>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
